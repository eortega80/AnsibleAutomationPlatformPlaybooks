---
# patch_windows_kb.yml
#
# Targeting is done by the AAP "Limit" (hosts: all), the same way as patch_rhel_host.yml.
# The job template must have Prompt on launch -> Limit enabled, and the machine must exist
# in the template's inventory under the same name/IP the caller puts in the Limit.
#
# Optionally narrow to a single KB by passing an extra var, e.g.:
#   ansible-playbook patch_windows_kb.yml -e "kb_number=KB5034763"
# Leave kb_number empty to install all applicable Security/Critical/Rollup updates.

- name: Patch Windows system
  hosts: all
  gather_facts: true

  vars:
    kb_number: ""                    # optional; empty = all applicable updates in the categories below
    reboot_after_patch: true         # set false to reboot manually later
    reboot_timeout: 3600             # seconds to wait for the host to come back (1 hour)
    update_categories:
      - SecurityUpdates
      - CriticalUpdates
      - UpdateRollups

  tasks:

    - name: Search for applicable updates
      ansible.windows.win_updates:
        state: searched
        category_names: "{{ update_categories }}"
        accept_list: "{{ [kb_number] if (kb_number | default('') | length > 0) else omit }}"
      register: search_result

    - name: Show what was found
      ansible.builtin.debug:
        msg: >-
          {{ search_result.found_update_count }} update(s) found on {{ inventory_hostname }}
          {{ '(filtered to ' + kb_number + ')' if (kb_number | length > 0) else '(Security/Critical/Rollups)' }}

    - name: Install updates
      ansible.windows.win_updates:
        category_names: "{{ update_categories }}"
        accept_list: "{{ [kb_number] if (kb_number | default('') | length > 0) else omit }}"
        reboot: "{{ reboot_after_patch }}"
        reboot_timeout: "{{ reboot_timeout }}"
      become: true
      become_method: runas
      become_user: SYSTEM              # some updates require SYSTEM privileges
      register: patch_result
      when: search_result.found_update_count | int > 0

    - name: Show patch result
      ansible.builtin.debug:
        msg: >-
          Installed {{ patch_result.installed_update_count | default(0) }} update(s).
          Reboot required: {{ patch_result.reboot_required | default(false) }}
      when: patch_result is defined and patch_result is not skipped

    - name: Note when nothing was applicable
      ansible.builtin.debug:
        msg: >-
          No applicable updates on {{ inventory_hostname }}{{ ' for ' + kb_number if (kb_number | length > 0) else '' }}.
      when: search_result.found_update_count | int == 0
