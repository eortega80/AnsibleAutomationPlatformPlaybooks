---
- name: Patch RHEL host
  hosts: all
  become: true
  gather_facts: true
  vars:
    rhsa: ""                 # optional advisory, e.g. RHSA-2026:0001; empty = all security updates
    security_only: true
    reboot_if_needed: true

  tasks:
    - name: Ensure needs-restarting is available (provided by dnf-utils)
      ansible.builtin.dnf:
        name: dnf-utils
        state: present

    # On-demand: apply only the packages in a specific advisory (RHSA/RHBA/RHEA).
    - name: "Apply a specific advisory ({{ rhsa }})"
      ansible.builtin.command:
        cmd: "dnf -y update --advisory={{ rhsa }}"
      register: advisory_result
      when: rhsa | length > 0
      changed_when: "'Nothing to do' not in advisory_result.stdout"
      failed_when: advisory_result.rc != 0

    - name: Apply security updates only
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: true
        update_only: true
      when:
        - rhsa | length == 0
        - security_only | bool
      register: patch_result

    - name: Apply all updates
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true
      when:
        - rhsa | length == 0
        - not (security_only | bool)
      register: patch_result

    - name: Check whether reboot is required
      ansible.builtin.command: needs-restarting -r
      register: reboot_check
      failed_when: false
      changed_when: false

    # needs-restarting -r exit codes: 0 = no reboot needed, 1 = reboot needed.
    # Any other code (e.g. 127 command not found) is treated as "do not reboot".
    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: 900
      when:
        - reboot_if_needed | bool
        - reboot_check.rc == 1
